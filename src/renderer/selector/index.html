<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleccionar Frase</title>
  <link rel="icon" type="image/png" href="assets/icon-32x32.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="selector-container">
    <div class="selector-header">
      <span class="selector-title" id="selector-hotkey">Mis Frases</span>
      <span class="selector-hint" id="selector-hint">Frases: [1..0] | Memoria: [Q,W,E,R]</span>
    </div>
    <div class="selector-memory-bar" id="selector-memory-bar">
      <!-- Injected via JS -->
    </div>
    <div class="selector-list" id="selector-list">
      <!-- Rendered via JS -->
    </div>
  </div>

  <script src="selector.js"></script>
</body>
</html>
